# Test profile configuration
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration/h2
    schemas: sqlrunner
    baseline-on-migrate: true

  h2:
    console:
      enabled: false

logging:
  level:
    org.flywaydb: WARN
    org.hibernate: WARN

# Test connections
sqlrunner:
  connections:
    databases:
      test-conn:
        name: Test Connection (H2)
        type: H2
        host: mem
        database: testdb
        credential-prefix: TEST_H2

# Set H2 credentials in env-style properties
TEST_H2_USER: sa
TEST_H2_PASSWORD: ""
