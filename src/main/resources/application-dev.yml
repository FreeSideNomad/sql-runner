# Development profile - SQL Server via Docker
spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=sqlrunner;encrypt=true;trustServerCertificate=true
    username: sa
    password: ${SQLSERVER_PASSWORD:SqlRunner2024!}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

  flyway:
    locations: classpath:db/migration/sqlserver

  h2:
    console:
      enabled: false

  thymeleaf:
    cache: false

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Override connections for dev profile
sqlrunner:
  connections:
    databases:
      local-sqlserver:
        name: Local SQL Server (Docker)
        type: SQLSERVER
        host: localhost
        port: 1433
        database: sqlrunner
        credentialPrefix: SQLSERVER
