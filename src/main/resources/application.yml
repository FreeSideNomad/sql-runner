spring:
  application:
    name: sql-runner

  # H2 Database (default for development/testing)
  datasource:
    url: jdbc:h2:mem:sqlrunner;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # Flyway Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: sqlrunner
    baseline-on-migrate: true
    validate-on-migrate: true

  # H2 Console (development only)
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # Thymeleaf configuration
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

server:
  port: 8080
  servlet:
    session:
      timeout: 20m
      cookie:
        http-only: true
        same-site: strict

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# SQL Runner specific configuration
sqlrunner:
  read-only-mode: false
  execution:
    default-timeout-seconds: 60
  update:
    max-affected-rows: 100000
  security:
    # Role mapping from AD groups (configure for production)
    role-mapping:
      ADMIN: CN=SQLRunner-Admins,OU=Groups,DC=company,DC=com
      UPDATE_RUNNER: CN=SQLRunner-UpdateRunners,OU=Groups,DC=company,DC=com
      SELECT_RUNNER: CN=SQLRunner-SelectRunners,OU=Groups,DC=company,DC=com

  # Database connections for query execution (configure for your environment)
  # Credentials are resolved from environment variables: {credential-prefix}_USER, {credential-prefix}_PASSWORD
  # Example configuration for production:
  #   sqlrunner.connections.databases.main-sqlserver.name=Main SQL Server
  #   sqlrunner.connections.databases.main-sqlserver.type=SQLSERVER
  #   sqlrunner.connections.databases.main-sqlserver.host=sqlserver.company.com
  #   etc.
  connections:
    databases: {}
