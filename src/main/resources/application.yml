spring:
  application:
    name: sql-runner

  # H2 Database (default for testing)
  datasource:
    url: jdbc:h2:mem:sqlrunner;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  # Flyway Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: sqlrunner
    baseline-on-migrate: true
    validate-on-migrate: true

  # H2 Console (development only)
  h2:
    console:
      enabled: true
      path: /h2-console

  # Thymeleaf configuration
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  # Security - disable for initial development
  security:
    user:
      name: admin
      password: admin

server:
  port: 8080
  servlet:
    session:
      timeout: 20m

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Application properties
sqlrunner:
  read-only-mode: false
  execution:
    default-timeout-seconds: 60
  update:
    max-affected-rows: 100000
