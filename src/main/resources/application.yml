spring:
  application:
    name: sql-runner

  # H2 Database (in-memory for tests only - dev profile uses SQL Server)
  datasource:
    url: jdbc:h2:mem:sqlrunner;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # Flyway Configuration (H2 for tests)
  flyway:
    enabled: true
    locations: classpath:db/migration/h2
    schemas: sqlrunner
    baseline-on-migrate: true
    validate-on-migrate: true

  # H2 Console (development only)
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # Thymeleaf configuration
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

server:
  port: 9090
  servlet:
    session:
      timeout: 20m
      cookie:
        http-only: true
        same-site: strict
  error:
    include-stacktrace: always
    include-exception: true
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# SQL Runner specific configuration
sqlrunner:
  read-only-mode: false
  execution:
    default-timeout-seconds: 60
  update:
    max-affected-rows: 100000
  security:
    # Role mapping from AD groups (configure for production)
    role-mapping:
      ADMIN: CN=SQLRunner-Admins,OU=Groups,DC=company,DC=com
      UPDATE_RUNNER: CN=SQLRunner-UpdateRunners,OU=Groups,DC=company,DC=com
      SELECT_RUNNER: CN=SQLRunner-SelectRunners,OU=Groups,DC=company,DC=com

  # Database connections for query execution
  # Credentials are resolved from environment variables: {credential-prefix}_USER, {credential-prefix}_PASSWORD
  # Example: LOCAL_SQLSERVER_USER, LOCAL_SQLSERVER_PASSWORD
  connections:
    databases:
      # Local Docker SQL Server
      local-sqlserver:
        name: Local SQL Server (Docker)
        type: SQLSERVER
        host: localhost
        port: 1433
        database: sqlrunner
        credentialPrefix: LOCAL_SQLSERVER

      # Local Docker PostgreSQL
      local-postgres:
        name: Local PostgreSQL (Docker)
        type: POSTGRES
        host: localhost
        port: 5432
        database: sqlrunner
        credentialPrefix: LOCAL_POSTGRES

      # Local Docker DB2 (DB2 max 8 char database names)
      local-db2:
        name: Local DB2 (Docker)
        type: DB2
        host: localhost
        port: 50000
        database: TESTDB
        credentialPrefix: LOCAL_DB2
