<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::content})}">
<div th:fragment="content">
    <!-- Page Header -->
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-rbc-blue">Queries</h1>
            <p class="text-gray-600 mt-1">Browse and execute parameterized queries</p>
        </div>
        <a th:href="@{/queries/new}" sec:authorize="hasRole('ADMIN')"
           class="px-4 py-2 bg-rbc-yellow text-rbc-blue font-semibold rounded-lg hover:bg-yellow-400 transition">
            + New Query
        </a>
    </div>

    <!-- Flash Messages -->
    <div th:if="${message}" class="mb-6 bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative">
        <span th:text="${message}">Message</span>
    </div>

    <!-- Empty State -->
    <div th:if="${queriesByCategory == null or queriesByCategory.empty}" class="bg-white rounded-lg shadow-md p-8 text-center">
        <svg class="w-12 h-12 mx-auto text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"/>
        </svg>
        <p class="text-lg text-gray-600">No queries available</p>
        <p class="text-sm text-gray-500 mt-2">Contact an administrator to create query templates.</p>
    </div>

    <!-- Queries by Category -->
    <div th:unless="${queriesByCategory == null or queriesByCategory.empty}" class="space-y-6">
        <div th:each="entry : ${queriesByCategory}" class="bg-white rounded-lg shadow-md overflow-hidden">
            <!-- Category Header -->
            <button type="button"
                    class="w-full text-left px-6 py-4 bg-gray-50 border-b flex justify-between items-center hover:bg-gray-100 transition"
                    onclick="toggleCategory(this)">
                <div class="flex items-center">
                    <svg class="w-5 h-5 text-rbc-blue mr-3 transform transition-transform category-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                    <span class="font-semibold text-rbc-blue" th:text="${entry.key}">Category Name</span>
                </div>
                <span class="text-sm text-gray-500" th:text="${entry.value.size()} + ' queries'">0 queries</span>
            </button>

            <!-- Query List -->
            <div class="category-content p-4">
                <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
                    <div th:each="query : ${entry.value}"
                         class="border rounded-lg p-4 hover:shadow-md transition bg-white">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-semibold text-gray-900" th:text="${query.name}">Query Name</h3>
                            <span th:if="${query.queryType.name() == 'SELECT'}"
                                  class="px-2 py-1 text-xs font-medium rounded-full bg-blue-100 text-blue-800">SELECT</span>
                            <span th:if="${query.queryType.name() == 'UPDATE_WORKFLOW'}"
                                  class="px-2 py-1 text-xs font-medium rounded-full bg-yellow-100 text-yellow-800">UPDATE</span>
                        </div>
                        <p class="text-sm text-gray-600 mb-3 line-clamp-2" th:text="${query.description ?: 'No description'}">Description</p>
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-gray-500" th:text="'Connection: ' + ${query.connectionName}">Connection</span>
                            <div class="flex gap-2">
                                <a th:href="@{/queries/{id}(id=${query.id})}"
                                   class="text-rbc-blue hover:underline font-medium">View</a>
                                <a th:href="@{/queries/{id}/edit(id=${query.id})}" sec:authorize="hasRole('ADMIN')"
                                   class="text-gray-500 hover:text-rbc-blue">Edit</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleCategory(button) {
            const content = button.nextElementSibling;
            const arrow = button.querySelector('.category-arrow');

            if (content.style.display === 'none') {
                content.style.display = 'block';
                arrow.classList.remove('-rotate-90');
            } else {
                content.style.display = 'none';
                arrow.classList.add('-rotate-90');
            }
        }
    </script>
</div>
</html>
