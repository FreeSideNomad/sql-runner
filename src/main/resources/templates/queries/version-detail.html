<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::content})}">
<div th:fragment="content">
    <!-- Page Header -->
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-rbc-blue" th:text="'Version ' + ${version.version}">Version</h1>
            <p class="text-gray-600 mt-1">
                <span th:text="${query.name}">Query Name</span> -
                Created <span th:text="${#temporals.format(version.createdAt, 'yyyy-MM-dd HH:mm')}">date</span>
                by <span th:text="${version.createdBy}">user</span>
            </p>
        </div>
        <a th:href="@{/queries/{id}/versions(id=${query.id})}" class="text-gray-600 hover:text-gray-800">
            &larr; Back to History
        </a>
    </div>

    <!-- Version Info -->
    <div th:if="${version.version == query.currentVersion}"
         class="mb-6 bg-blue-50 border border-blue-200 rounded-lg p-4">
        <div class="flex items-center">
            <svg class="w-5 h-5 text-blue-600 mr-2" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
            </svg>
            <span class="text-blue-800">This is the <strong>current active version</strong></span>
        </div>
    </div>

    <div th:unless="${version.version == query.currentVersion}"
         class="mb-6 bg-yellow-50 border border-yellow-200 rounded-lg p-4">
        <div class="flex items-center">
            <svg class="w-5 h-5 text-yellow-600 mr-2" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
            </svg>
            <span class="text-yellow-800">This is an <strong>archived version</strong>. The current version is v<span th:text="${query.currentVersion}">1</span>.</span>
        </div>
    </div>

    <!-- Configuration -->
    <div class="bg-white rounded-lg shadow-md p-6">
        <h2 class="text-lg font-semibold text-rbc-blue mb-4">Configuration</h2>
        <pre class="bg-gray-50 rounded-lg p-4 text-sm overflow-x-auto font-mono whitespace-pre-wrap" th:text="${version.configYaml}">YAML config</pre>
    </div>
</div>
</html>
