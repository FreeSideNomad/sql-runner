<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Validate Import</title>
</head>
<body>
<div th:replace="~{layout/base :: layout(~{::content})}">
    <div th:fragment="content">
        <!-- Breadcrumb -->
        <nav class="mb-4">
            <ol class="flex text-sm text-gray-500">
                <li><a href="/admin" class="hover:text-rbc-blue">Administration</a></li>
                <li class="mx-2">/</li>
                <li><a href="/admin/import" class="hover:text-rbc-blue">Import</a></li>
                <li class="mx-2">/</li>
                <li class="text-gray-700">Validate</li>
            </ol>
        </nav>

        <h1 class="text-2xl font-bold text-gray-800 mb-6">Import Validation</h1>

        <div class="bg-white rounded-lg shadow p-6 max-w-3xl">
            <!-- File Info -->
            <div class="mb-6 pb-6 border-b">
                <h2 class="text-lg font-semibold text-gray-800">File: <span th:text="${filename}" class="font-normal">filename.yaml</span></h2>
                <p class="text-gray-600">
                    <span th:text="${validation.queryCount}">0</span> queries found
                </p>
            </div>

            <!-- Validation Status -->
            <div th:if="${validation.valid}" class="mb-6 bg-green-50 border border-green-200 rounded-lg p-4">
                <div class="flex items-center">
                    <svg class="w-6 h-6 text-green-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span class="text-green-800 font-medium">Validation Passed</span>
                </div>
                <p class="text-green-700 mt-1">The file is valid and ready for import.</p>
            </div>

            <div th:if="${!validation.valid}" class="mb-6 bg-red-50 border border-red-200 rounded-lg p-4">
                <div class="flex items-center">
                    <svg class="w-6 h-6 text-red-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span class="text-red-800 font-medium">Validation Failed</span>
                </div>
                <ul class="text-red-700 mt-2 list-disc list-inside">
                    <li th:each="error : ${validation.errors}" th:text="${error}">Error</li>
                </ul>
            </div>

            <!-- Warnings -->
            <div th:if="${validation.warnings != null && !validation.warnings.isEmpty()}"
                 class="mb-6 bg-yellow-50 border border-yellow-200 rounded-lg p-4">
                <div class="flex items-center">
                    <svg class="w-6 h-6 text-yellow-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                    </svg>
                    <span class="text-yellow-800 font-medium">Warnings</span>
                </div>
                <ul class="text-yellow-700 mt-2 list-disc list-inside">
                    <li th:each="warning : ${validation.warnings}" th:text="${warning}">Warning</li>
                </ul>
            </div>

            <!-- Actions -->
            <div class="flex gap-4">
                <form th:if="${validation.valid}" action="/admin/import/execute" method="post">
                    <input type="hidden" name="yamlContent" th:value="${yamlContent}">
                    <button type="submit"
                            class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition-colors">
                        <span class="flex items-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                            </svg>
                            Execute Import
                        </span>
                    </button>
                </form>

                <a href="/admin/import"
                   class="bg-gray-200 text-gray-700 px-6 py-3 rounded-lg hover:bg-gray-300 transition-colors">
                    Cancel
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
