<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="${pageTitle}">Query Management</title>
</head>
<body>
<div th:replace="~{layout/base :: layout(~{::content})}">
    <div th:fragment="content">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Query Management</h1>
            <a th:href="@{/queries/new}"
               class="bg-rbc-blue text-white px-4 py-2 rounded-lg hover:bg-rbc-light-blue transition-colors">
                New Query
            </a>
        </div>

        <!-- Flash Messages -->
        <div th:if="${message}" class="mb-4 bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">
            <span th:text="${message}">Message</span>
        </div>
        <div th:if="${error}" class="mb-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
            <span th:text="${error}">Error</span>
        </div>

        <!-- Queries Table -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Connection</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Version</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <tr th:each="query : ${queries}">
                        <td class="px-6 py-4">
                            <div class="text-sm font-medium text-gray-900" th:text="${query.name}">Query Name</div>
                            <div class="text-xs text-gray-500" th:text="${query.description}">Description</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span th:text="${query.queryType}"
                                  th:class="${query.queryType.name() == 'SELECT' ? 'bg-green-100 text-green-800' : 'bg-orange-100 text-orange-800'}"
                                  class="px-2 py-1 text-xs font-semibold rounded-full">
                                TYPE
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${query.connectionName}">
                            connection
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${'v' + query.currentVersion}">
                            v1
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span th:if="${query.isActive}"
                                  class="px-2 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800">
                                Active
                            </span>
                            <span th:unless="${query.isActive}"
                                  class="px-2 py-1 text-xs font-semibold rounded-full bg-gray-100 text-gray-600">
                                Inactive
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm space-x-2">
                            <a th:href="@{'/queries/' + ${query.id}}"
                               class="text-rbc-blue hover:text-rbc-light-blue">View</a>
                            <a th:href="@{'/queries/' + ${query.id} + '/edit'}"
                               class="text-gray-600 hover:text-gray-900">Edit</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(queries)}">
                        <td colspan="6" class="px-6 py-8 text-center text-gray-500">
                            No queries defined.
                            <a th:href="@{/queries/new}" class="text-rbc-blue hover:underline">Create your first query</a>.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
