<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<aside th:fragment="sidebar" class="w-64 bg-white shadow-lg fixed top-16 bottom-0 left-0 overflow-y-auto">
    <nav class="p-4">
        <ul class="space-y-1">
            <!-- Dashboard -->
            <li>
                <a th:href="@{/dashboard}"
                   th:classappend="${currentPage == 'dashboard'} ? 'bg-rbc-blue text-white' : 'text-gray-700 hover:bg-gray-100'"
                   class="flex items-center px-4 py-2.5 rounded-lg transition font-medium">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    Dashboard
                </a>
            </li>

            <!-- Queries -->
            <li>
                <a th:href="@{/queries}"
                   th:classappend="${currentPage == 'queries'} ? 'bg-rbc-blue text-white' : 'text-gray-700 hover:bg-gray-100'"
                   class="flex items-center px-4 py-2.5 rounded-lg transition font-medium">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"/>
                    </svg>
                    Queries
                </a>
            </li>

            <!-- History -->
            <li>
                <a th:href="@{/history}"
                   th:classappend="${currentPage == 'history'} ? 'bg-rbc-blue text-white' : 'text-gray-700 hover:bg-gray-100'"
                   class="flex items-center px-4 py-2.5 rounded-lg transition font-medium">
                    <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    Execution History
                </a>
            </li>

            <!-- Admin Section (ADMIN role only) -->
            <li sec:authorize="hasRole('ADMIN')" class="pt-4 border-t mt-4">
                <span class="text-xs text-gray-500 uppercase tracking-wider px-4 font-semibold">Administration</span>

                <ul class="mt-2 space-y-1">
                    <!-- Connections -->
                    <li>
                        <a th:href="@{/admin/connections}"
                           th:classappend="${currentPage == 'connections'} ? 'bg-rbc-blue text-white' : 'text-gray-700 hover:bg-gray-100'"
                           class="flex items-center px-4 py-2.5 rounded-lg transition font-medium">
                            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"/>
                            </svg>
                            Connections
                        </a>
                    </li>

                    <!-- Query Management -->
                    <li>
                        <a th:href="@{/admin/queries}"
                           th:classappend="${currentPage == 'admin-queries'} ? 'bg-rbc-blue text-white' : 'text-gray-700 hover:bg-gray-100'"
                           class="flex items-center px-4 py-2.5 rounded-lg transition font-medium">
                            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                            </svg>
                            Query Management
                        </a>
                    </li>

                    <!-- Import/Export -->
                    <li>
                        <a th:href="@{/admin/import-export}"
                           th:classappend="${currentPage == 'import-export'} ? 'bg-rbc-blue text-white' : 'text-gray-700 hover:bg-gray-100'"
                           class="flex items-center px-4 py-2.5 rounded-lg transition font-medium">
                            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                            </svg>
                            Import/Export
                        </a>
                    </li>
                </ul>
            </li>
        </ul>
    </nav>
</aside>
</html>
