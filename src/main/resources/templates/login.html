<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Runner - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .rbc-blue { background-color: #003168; }
        .rbc-yellow { background-color: #FFD200; }
        .rbc-blue-text { color: #003168; }
        .rbc-yellow-hover:hover { background-color: #e6bd00; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold rbc-blue-text">SQL Runner</h1>
            <p class="text-gray-600 mt-2">Parameterized Query Execution</p>
        </div>

        <!-- Error message -->
        <div th:if="${errorMessage}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
            <span th:text="${errorMessage}">Error message</span>
        </div>

        <!-- Logout message -->
        <div th:if="${logoutMessage}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
            <span th:text="${logoutMessage}">Logout message</span>
        </div>

        <!-- Session expired message -->
        <div th:if="${expiredMessage}" class="bg-yellow-100 border border-yellow-400 text-yellow-700 px-4 py-3 rounded mb-4">
            <span th:text="${expiredMessage}">Session expired</span>
        </div>

        <form th:action="@{/login}" method="post" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="username" name="username" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                       placeholder="Enter your username">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                       placeholder="Enter your password">
            </div>

            <button type="submit"
                    class="w-full rbc-yellow rbc-yellow-hover text-gray-900 font-semibold py-2 px-4 rounded-md transition duration-200">
                Sign In
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-500">
            <p>Session timeout: 20 minutes</p>
        </div>
    </div>
</body>
</html>
