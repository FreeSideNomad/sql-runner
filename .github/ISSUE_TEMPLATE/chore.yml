name: Chore
description: Technical tasks, refactoring, maintenance
title: "Chore: "
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: |
        Technical task or maintenance work.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done?
      placeholder: Describe the task...
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this needed?
      placeholder: Explain why this is needed...
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: Checklist of work items
      placeholder: |
        - [ ] Task 1
        - [ ] Task 2
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What parts of the codebase are affected?
      placeholder: List affected areas...
    validations:
      required: false
