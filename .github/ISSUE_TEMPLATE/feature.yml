name: Feature
description: Propose a new feature (epic-level, contains multiple stories)
title: "Feature: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a new feature!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear description of the feature
      placeholder: Describe the feature...
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What conditions must be met for this feature to be complete?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: textarea
    id: user-stories
    attributes:
      label: User Stories
      description: List of stories that make up this feature
      placeholder: |
        - [ ] #XX - Story title
        - [ ] #XX - Story title
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Other features or external dependencies
      placeholder: List any dependencies...
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Additional context, design decisions, risks
      placeholder: Any additional notes...
    validations:
      required: false
