name: Bug Report
description: Report a defect
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What's broken?
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Step 1
        2. Step 2
        3. Step 3
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: Describe expected behavior...
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happens?
      placeholder: Describe actual behavior...
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: Database
      description: Which database is affected?
      options:
        - SQL Server
        - PostgreSQL
        - DB2
        - All
        - N/A
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Screenshots/Logs
      description: If applicable, add screenshots or logs
      placeholder: Paste logs or attach screenshots...
    validations:
      required: false
