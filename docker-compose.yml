# Local development databases
# Start with: docker-compose up -d
# Stop with: docker-compose down
# Reset data: docker-compose down -v
#
# Apple Silicon (M1/M2/M3/M4/M5) Notes:
# - Enable "Use Rosetta for x86_64/amd64 emulation" in Docker Desktop settings
# - SQL Server and DB2 are x86_64 images that run via Rosetta emulation
# - PostgreSQL has native ARM64 support

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: sqlrunner-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SqlRunner123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./docker/sqlserver-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "SqlRunner123!" -C -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: sqlrunner-postgres
    environment:
      POSTGRES_USER: sqlrunner
      POSTGRES_PASSWORD: "SqlRunner123!"
      POSTGRES_DB: sqlrunner
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlrunner"]
      interval: 10s
      timeout: 5s
      retries: 5

  db2:
    image: icr.io/db2_community/db2:latest
    platform: linux/amd64
    container_name: sqlrunner-db2
    privileged: true
    environment:
      LICENSE: accept
      DB2INST1_PASSWORD: "SqlRunner123!"
      DBNAME: sqlrunner
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
    ports:
      - "50000:50000"
    volumes:
      - db2-data:/database
      - ./docker/db2-init:/var/custom
    healthcheck:
      test: ["CMD", "/opt/ibm/db2/V11.5/bin/db2", "connect", "to", "sqlrunner"]
      interval: 30s
      timeout: 10s
      retries: 10

volumes:
  sqlserver-data:
  postgres-data:
  db2-data:
